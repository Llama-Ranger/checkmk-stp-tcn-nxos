[project]
name = "checkmk-stp-tcn-nxos"
version = "2.1.1"
description = "Checkmk extension: spanning-tree topology change (TCN) monitoring per VLAN for Cisco Nexus (NX-OS) via SNMPv3"
readme = "README.md"
authors = [{ name = "John Jimenez" }, { name = "Cledir Justo" }]
requires-python = ">=3.12"
license = { text = "GPL-2.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

# The special agent needs only the Python standard library and the Net-SNMP
# command line tools, both of which ship with every Checkmk site.
dependencies = []

[project.optional-dependencies]
# The tests also need Checkmk's plug-in API packages (cmk-agent-based,
# cmk-rulesets, ... or cmk-plugin-apis), which are installed from the Checkmk
# source tree - see README "Development" and .github/workflows/build.yml.
dev = [
    "pytest",
    "pydantic",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Llama-Ranger/checkmk-stp-tcn-nxos"

# The package is not installed with pip - it is built into an .mkp with
# scripts/build_mkp.py - so no build backend is configured on purpose.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dist"]
# The special agent is installed without a .py suffix, so ruff has to be told
# about it explicitly.
extend-include = ["**/libexec/agent_nxos_stp_tcn"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "BLE",  # blind except - the agent marks its deliberate one with noqa
    "RUF",
]
ignore = [
    "B008",    # function call in default argument - used by the Checkmk form specs
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
